let currentSort = 'episode';
let chart;
let sortedData = [];

function getColor(views) {
  if (views >= 5000) return '#3266ad';
  if (views >= 2000) return '#5c8fc9';
  if (views >= 1000) return '#89b4de';
  return '#b8d3ef';
}

function buildChart(sorted) {
  sortedData = sorted;
  const labels = sorted.map(d => d.ep);
  const data = sorted.map(d => d.views);
  const colors = sorted.map(d => getColor(d.views));

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById('viewsChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '閲覧数',
        data,
        backgroundColor: colors,
        hoverBackgroundColor: sorted.map(() => '#1a4a8a'),
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cursor: 'pointer',
      onClick: (evt, elements) => {
        if (elements.length > 0) {
          const idx = elements[0].index;
          window.open(sortedData[idx].url);
        }
      },
      onHover: (evt, elements) => {
        evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              const idx = items[0].dataIndex;
              return sortedData[idx].ep + ' ' + sortedData[idx].title;
            },
            label: (item) => '閲覧数: ' + item.raw.toLocaleString() + '回'
          }
        }
      },
      scales: {
        x: {
          ticks: {
            font: { size: 10 },
            maxRotation: 45,
            autoSkip: false,
            color: '#888'
          },
          grid: { display: false }
        },
        y: {
          ticks: {
            callback: v => v >= 1000 ? (v/1000).toFixed(0) + 'k' : v,
            font: { size: 11 },
            color: '#888'
          },
          grid: { color: 'rgba(128,128,128,0.15)' }
        }
      }
    }
  });
}

function sortBy(type) {
  currentSort = type;
  document.getElementById('btn-episode').style.fontWeight = type === 'episode' ? '500' : '400';
  document.getElementById('btn-views').style.fontWeight = type === 'views' ? '500' : '400';

  let sorted;
  if (type === 'episode') {
    sorted = [...rawData].sort((a, b) => {
      const na = parseInt(a.ep.replace('#','')) || 0;
      const nb = parseInt(b.ep.replace('#','')) || 0;
      return na - nb;
    });
  } else {
    sorted = [...rawData].sort((a, b) => b.views - a.views);
  }
  buildChart(sorted);
}

sortBy('episode');
